name: tests
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: every link, picture and page answers
        run: node tests/links.mjs
        env:
          OFFLINE: '1'
      - name: screenshots — chromium + webkit, phone and laptop
        run: node tests/shots.mjs
        env:
          QUICK: '1'
      - name: the screenshots, to flick through
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/out/
          retention-days: 14
