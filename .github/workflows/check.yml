name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: the generated pages are up to date
        run: node scripts/build.mjs && git diff --exit-code
      - name: weight budget
        run: node scripts/check-weight.mjs
